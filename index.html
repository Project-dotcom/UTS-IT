<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTS Informatika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f5f7f8;
  --card: #ffffff;
  --fg: #1d2429;
  --muted: #66727c;
  --line: #e2e7ea;
  --soft: #eef2f4;
  --accent: #2c5f7f;
  --accent-fg: #ffffff;
  --warn: #b3402c;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111518; --card: #182025; --fg: #e6ebee; --muted: #8e9ba5;
    --line: #28323a; --soft: #1f2a31; --accent: #7fb3d5; --accent-fg: #0e1a22; --warn: #f0917c;
  }
}
:root[data-theme="dark"] {
  --bg: #111518; --card: #182025; --fg: #e6ebee; --muted: #8e9ba5;
  --line: #28323a; --soft: #1f2a31; --accent: #7fb3d5; --accent-fg: #0e1a22; --warn: #f0917c;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Tombol */
.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  padding: 3px 11px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 13px;
  transition: background .15s;
}
.btn:hover:not(:disabled) { background: var(--soft); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }

/* Layout: layar dipakai sebanyak mungkin untuk soal */
.app { display: flex; flex-direction: column; }
@media (min-width: 861px) { .app { height: 100dvh; } }

/* Bar atas tipis */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--card); border-bottom: 1px solid var(--line);
}
.bar-in {
  padding: 4px 14px; display: flex; align-items: center; justify-content: space-between;
  gap: 4px 16px; flex-wrap: wrap;
}
.bar-title { font-weight: 600; font-size: 14px; }
.bar-right { display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap; }
.grp { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.grp .lbl { color: var(--muted); }
.grp .val { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
.chk { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }

/* Dua bagian */
.grid {
  flex: 1; min-height: 0; padding: 8px 10px 10px;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 10px;
}
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; grid-template-rows: none; padding: 10px; gap: 12px; } }
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
}
.panel.ended { border-color: var(--warn); }

/* Kepala bagian + timer dalam satu baris */
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 4px 12px; flex-wrap: wrap; padding: 6px 14px;
}
.ph-left { display: flex; align-items: baseline; gap: 10px; }
.ph-left h2 { margin: 0; font-size: 16px; font-weight: 600; }
.ph-left span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.ph-right { display: flex; align-items: center; gap: 6px; }
.time {
  font-size: 26px; font-weight: 600; line-height: 1.1; margin-right: 6px;
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
}
.time.low { color: var(--warn); }
.tbar { height: 3px; background: var(--soft); }
.tbar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .3s linear; }
.tbar.low i { background: var(--warn); }

/* Soal: ukuran huruf diatur otomatis lewat JS agar mengisi ruang */
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 18px; font-size: 22px; line-height: 1.5; }
@media (max-width: 860px) { .panel-body { overflow: visible; } }
.panel-body p { margin: 0 0 0.6em; }
.panel-body p.task { padding-left: 0.6em; border-left: 4px solid var(--accent); }
.panel-body p.sub { padding-left: 0.2em; margin-bottom: 0.4em; }
.tablewrap { overflow-x: auto; margin: 0 0 0.7em; }
table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
th, td { border: 1px solid var(--line); padding: 0.2em 0.6em; text-align: left; vertical-align: top; }
th { background: var(--soft); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Navigasi tipis */
.panel-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 5px 14px; border-top: 1px solid var(--line);
}
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dot {
  width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
  background: transparent; cursor: pointer; font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums; padding: 0;
}
.dot:hover { background: var(--soft); }
.dot.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.row { display: flex; gap: 6px; }
</style>
</head>
<body>

const DATA = { A: BAGIAN_A, B: BAGIAN_B };
const TOTAL = 10;
const STORE = "uts-informatika-proyektor-v1";

/* ===== Pengaturan (disimpan di browser) ===== */
function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {} }
const cfg = Object.assign({ min: 5, sound: true, a: 0, b: 0 }, load());
cfg.a = Math.min(TOTAL - 1, Math.max(0, cfg.a | 0));
cfg.b = Math.min(TOTAL - 1, Math.max(0, cfg.b | 0));

const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") el.className = props[k];
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), props[k]);
    else if (k === "text") el.textContent = props[k];
    else el.setAttribute(k, props[k]);
  }
  kids.flat().forEach((c) => c != null && el.append(c));
  return el;
}

/* ===== Timer per soal (satu untuk tiap bagian) ===== */
const mkTimer = () => ({ dur: cfg.min * 60, left: cfg.min * 60, running: false, end: 0, done: false });
const T = { A: mkTimer(), B: mkTimer() };

function cur(s) {
  const t = T[s];
  return t.running ? Math.max(0, Math.ceil((t.end - Date.now()) / 1000)) : t.left;
}
function fmt(sec) {
  const p = (n) => String(n).padStart(2, "0");
  return `${p(Math.floor(sec / 60))}:${p(sec % 60)}`;
}
function paintTimer(s) {
  const el = $("tm-" + s);
  if (!el) return;
  const t = T[s], r = cur(s);
  const low = t.done || (r <= 60 && (t.running || r < t.dur));
  el.textContent = fmt(r);
  el.classList.toggle("low", low);
  $("tb-" + s).classList.toggle("low", low);
  $("tf-" + s).style.width = (t.dur > 0 ? (r / t.dur) * 100 : 0) + "%";
  $("panel" + s).classList.toggle("ended", t.done);
  $("tg-" + s).textContent = t.done ? "Ulang" : t.running ? "Jeda" : r < t.dur ? "Lanjut" : "Mulai";
}
function toggleTimer(s) {
  unlockAudio();
  const t = T[s];
  if (t.done) { T[s] = mkTimer(); }
  else if (t.running) { t.left = cur(s); t.running = false; }
  else if (t.left > 0) { t.end = Date.now() + t.left * 1000; t.running = true; }
  paintTimer(s);
}
function resetTimer(s) { T[s] = mkTimer(); paintTimer(s); }
function addMinute(s) {
  const t = T[s];
  if (t.done) { t.done = false; t.dur = 60; t.left = 60; t.running = false; }
  else { t.dur += 60; if (t.running) t.end += 60000; else t.left += 60; }
  paintTimer(s);
}
setInterval(() => {
  ["A", "B"].forEach((s) => {
    const t = T[s];
    if (t.running && cur(s) <= 0) { t.running = false; t.left = 0; t.done = true; beep(); }
    paintTimer(s);
  });
}, 250);

/* ===== Bunyi ===== */
let ac = null;
function unlockAudio() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
  } catch (e) {}
}
function beep() {
  if (!cfg.sound || !ac) return;
  try {
    const now = ac.currentTime;
    [0, 0.3, 0.6].forEach((d) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, now + d);
      g.gain.exponentialRampToValueAtTime(0.3, now + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + d + 0.22);
      o.connect(g); g.connect(ac.destination);
      o.start(now + d); o.stop(now + d + 0.25);
    });
  } catch (e) {}
}

/* ===== Tampilan soal ===== */
const isWide = () => window.matchMedia("(min-width: 861px)").matches;

// Besarkan huruf sampai soal pas mengisi kotaknya (tanpa perlu digulir)
function fit(side) {
  const body = document.querySelector("#panel" + side + " .panel-body");
  if (!body) return;
  if (!isWide()) { body.style.fontSize = "20px"; return; }
  const prevOverflow = body.style.overflowY;
  body.style.overflowY = "hidden";
  let lo = 16, hi = 52;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    body.style.fontSize = mid + "px";
    if (body.scrollHeight <= body.clientHeight + 1) lo = mid; else hi = mid;
  }
  body.style.fontSize = lo + "px";
  body.style.overflowY = prevOverflow;
}

function renderPanel(side) {
  const key = side.toLowerCase();
  const i = cfg[key];
  const panel = $("panel" + side);
  panel.innerHTML = "";

  const body = h("div", { class: "panel-body" });
  DATA[side][i].forEach((b) => {
    if (typeof b === "string") {
      body.append(h("p", { class: b.startsWith("Tugas:") ? "task" : "", text: b }));
    } else if (b.s) {
      body.append(h("p", { class: "sub", text: b.s }));
    } else if (b.t) {
      const [head, ...rows] = b.t;
      body.append(h("div", { class: "tablewrap" }, h("table", null,
        h("thead", null, h("tr", null, head.map((c) => h("th", { text: c })))),
        h("tbody", null, rows.map((r) => h("tr", null, r.map((c, ci) =>
          h("td", { class: /^[\d,]+$/.test(c) && ci > 0 ? "num" : "", text: c })))))
      )));
    }
  });

  const go = (n) => {
    cfg[key] = Math.min(TOTAL - 1, Math.max(0, n));
    save();
    T[side] = mkTimer();   // timer dimulai ulang untuk tiap soal
    renderPanel(side);
  };

  const dots = h("div", { class: "dots" }, Array.from({ length: TOTAL }, (_, n) =>
    h("button", {
      class: "dot" + (n === i ? " on" : ""),
      "aria-label": `Bagian ${side} soal ${n + 1}`,
      "aria-current": n === i ? "true" : "false",
      onclick: () => go(n),
      text: String(n + 1)
    })));
  const prev = h("button", { class: "btn", onclick: () => go(i - 1), text: "Sebelumnya" });
  const next = h("button", { class: "btn primary", onclick: () => go(i + 1), text: "Berikutnya" });
  if (i === 0) prev.disabled = true;
  if (i === TOTAL - 1) next.disabled = true;

  panel.append(
    h("div", { class: "panel-head" },
      h("div", { class: "ph-left" },
        h("h2", { text: "Bagian " + side }),
        h("span", { text: `Soal ${i + 1} dari ${TOTAL}` })),
      h("div", { class: "ph-right" },
        h("div", { class: "time", id: "tm-" + side, role: "timer", text: "00:00" }),
        h("button", { class: "btn primary", id: "tg-" + side, onclick: () => toggleTimer(side), text: "Mulai" }),
        h("button", { class: "btn", onclick: () => resetTimer(side), text: "Ulang" }),
        h("button", { class: "btn", onclick: () => addMinute(side), text: "+1 menit" }))),
    h("div", { class: "tbar", id: "tb-" + side }, h("i", { id: "tf-" + side })),
    body,
    h("div", { class: "panel-foot" }, dots, h("div", { class: "row" }, prev, next))
  );
  paintTimer(side);
  fit(side);
}

/* ===== Kontrol bar atas ===== */
function paintMin() { $("minVal").textContent = cfg.min + " menit"; }
function setMin(n) {
  cfg.min = Math.min(60, Math.max(1, n));
  save(); paintMin();
  // timer yang belum dijalankan ikut memakai durasi baru
  ["A", "B"].forEach((s) => {
    const t = T[s];
    if (!t.running && !t.done && t.left === t.dur) { T[s] = mkTimer(); paintTimer(s); }
  });
}
$("minDown").addEventListener("click", () => setMin(cfg.min - 1));
$("minUp").addEventListener("click", () => setMin(cfg.min + 1));
$("snd").checked = !!cfg.sound;
$("snd").addEventListener("change", (e) => { cfg.sound = e.target.checked; save(); if (cfg.sound) unlockAudio(); });

if (document.fullscreenEnabled) {
  $("fullBtn").hidden = false;
  $("fullBtn").addEventListener("click", () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => {
    $("fullBtn").textContent = document.fullscreenElement ? "Keluar layar penuh" : "Layar penuh";
  });
}

/* ===== Mulai ===== */
paintMin();
renderPanel("A"); renderPanel("B");
// ukuran huruf disesuaikan ulang saat jendela/layar berubah dan setelah font termuat
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => { fit("A"); fit("B"); });
  ro.observe($("panelA")); ro.observe($("panelB"));
} else {
  window.addEventListener("resize", () => { fit("A"); fit("B"); });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit("A"); fit("B"); });
</script>
</body>
